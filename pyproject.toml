[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "moldock"
version = "0.1.0"
description = "Molecular Docking Framework in Python with AutoDock Vina Scoring, Metal Co-factor Coordination, and Protein-Ligand / Protein-Protein Docking"
readme = "README.md"
authors = [{ name = "MolDock Contributors" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.20.0",
]

[project.optional-dependencies]
full = [
    "scipy>=1.7.0",
    "vina>=1.2.3",
    "rdkit>=2022.9.1",
    "meeko>=0.4.0",
    "biopython>=1.80",
]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
moldock = "moldock.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["moldock*"]

